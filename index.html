<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fireboy Multiplayer Streaming</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; 
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw; height: 100dvh;
            color: white;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- GLASS DESIGN --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 400px;
            text-align: center;
            display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        h2 { margin: 0 0 10px 0; font-size: 22px; }
        p { margin: 0; color: #aaa; font-size: 14px; }

        input {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 1px solid #444; background: #222;
            color: white; font-size: 18px; text-align: center; outline: none;
        }

        button {
            width: 100%; padding: 16px; border-radius: 14px;
            border: none; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }

        .btn-primary { background: #0a84ff; color: white; }
        .btn-sec { background: rgba(255,255,255,0.1); color: #ccc; }
        .btn-fire { background: linear-gradient(90deg, #d32f2f, #f44336); color: white; }
        .btn-water { background: linear-gradient(90deg, #1976d2, #2196f3); color: white; }

        /* --- SCREENS --- */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; justify-content: center; align-items: center; z-index: 50; }
        .active { display: flex; }

        /* --- GAME & VIDEO --- */
        #game-view {
            width: 100%; height: 100%; display: none; position: relative;
            background: #000; justify-content: center; align-items: center;
        }
        
        #game-wrapper { transform-origin: center; display: flex; justify-content: center; align-items: center; }
        
        /* O Host usa o Ruffle, o Cliente usa o Video */
        ruffle-player { width: 800px; height: 600px; background: black; display: none; } 
        video { width: 800px; height: 600px; background: black; display: none; object-fit: contain; }

        /* --- CONTROLS --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: none; }
        
        .d-pad { position: absolute; bottom: 20px; left: 20px; width: 180px; height: 180px; pointer-events: auto; }
        .d-btn {
            position: absolute; width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: white; border-radius: 12px;
        }
        .d-btn:active { background: rgba(255, 255, 255, 0.4); }
        .d-up { top: 0; left: 60px; } .d-down { bottom: 0; left: 60px; }
        .d-left { top: 60px; left: 0; } .d-right { top: 60px; right: 0; }
        
        .action-btn {
            position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px;
            background: rgba(255, 0, 0, 0.2); border: 2px solid rgba(255, 100, 100, 0.5);
            border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; font-size: 40px; color: white;
        }
        .action-btn:active { background: rgba(255, 0, 0, 0.6); }

        /* --- SETTINGS --- */
        #settings-btn {
            position: absolute; top: 10px; right: 10px; z-index: 200;
            background: rgba(0,0,0,0.5); color: white; border: none;
            padding: 8px 12px; border-radius: 20px; pointer-events: auto; backdrop-filter: blur(10px); width: auto;
        }
        #settings-panel {
            position: absolute; top: 50px; right: 10px;
            background: rgba(20, 20, 20, 0.95); padding: 20px; border-radius: 20px;
            color: white; display: none; flex-direction: column; gap: 15px;
            pointer-events: auto; z-index: 200; width: 250px; border: 1px solid #333;
        }
        .edit-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 4px dashed #ffd60a; z-index: 50; display: none; pointer-events: auto; 
            justify-content: center; align-items: center; color: #ffd60a; font-weight: bold; background: rgba(0,0,0,0.5);
        }
        
        .loading-text { color: #0a84ff; font-weight: bold; margin-top: 10px; display:none;}
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="glass-panel">
            <h2>Fireboy Stream</h2>
            <p>Digite seu apelido</p>
            <input type="text" id="input-nick" placeholder="Apelido..." maxlength="10">
            <button class="btn-primary" onclick="saveNickAndGo()">CONTINUAR</button>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <div class="glass-panel">
            <h2 id="greet-msg">Olá</h2>
            <button class="btn-primary" onclick="toRoleSelection()">CRIAR SALA (HOST)</button>
            <button class="btn-sec" onclick="toJoinScreen()">ENTRAR (CLIENTE)</button>
            <p style="font-size:11px; margin-top:10px;">O Host deve ser o celular mais potente.</p>
        </div>
    </div>

    <div id="screen-role" class="screen">
        <div class="glass-panel">
            <h2>Escolha seu Personagem</h2>
            <button class="btn-fire" onclick="setupHost('fireboy')">🔥 JOGAR COMO FIREBOY</button>
            <button class="btn-water" onclick="setupHost('watergirl')">💧 JOGAR COMO WATERGIRL</button>
            <button class="btn-sec" onclick="backToMenu()">Voltar</button>
        </div>
    </div>

    <div id="screen-host-lobby" class="screen">
        <div class="glass-panel">
            <h3>Código da Sala</h3>
            <input type="text" id="host-code" readonly style="font-size: 26px; letter-spacing: 3px; color: #32d74b; font-weight:bold;">
            <p id="host-status">Aguardando conexão...</p>
            <div id="loading-host" class="loading-text">Iniciando Stream... 🎥</div>
            <button class="btn-sec" onclick="location.reload()">Cancelar</button>
        </div>
    </div>

    <div id="screen-join" class="screen">
        <div class="glass-panel">
            <h3>Entrar na Sala</h3>
            <input type="text" id="join-code" placeholder="CÓDIGO" maxlength="6" style="text-transform: uppercase;">
            <button class="btn-primary" onclick="joinRoom()">CONECTAR</button>
            <p id="join-status">Certifique-se de estar no Wi-Fi.</p>
            <button class="btn-sec" onclick="backToMenu()">Voltar</button>
        </div>
    </div>

    <div id="game-view">
        <div id="edit-overlay" class="edit-overlay">ARRASTE PARA CENTRALIZAR</div>
        
        <div id="game-wrapper">
            <ruffle-player id="ruffle-instance"></ruffle-player>
            <video id="remote-video" autoplay playsinline></video>
        </div>

        <button id="settings-btn" onclick="toggleEditMode()">⚙️ Ajustes</button>
        <div id="settings-panel">
            <label>Zoom: <span id="zoom-val">1.0</span>x</label>
            <input type="range" id="zoom-slider" min="0.5" max="2.5" step="0.1" value="1.0" oninput="updateZoom(this.value)">
            <button class="btn-primary" onclick="toggleEditMode()">Concluir</button>
        </div>

        <div id="ui-layer">
            <div class="d-pad">
                <div class="d-btn d-up" id="btn-up">⬆</div>
                <div class="d-btn d-left" id="btn-left">⬅</div>
                <div class="d-btn d-right" id="btn-right">➡</div>
                <div class="d-btn d-down" id="btn-down">⬇</div>
            </div>
            <div class="action-btn" id="btn-jump">↟</div>
        </div>
    </div>

    <script>
        // --- VARIAVEIS ---
        let myNick = localStorage.getItem('fb_nick') || "";
        let myRole = ""; 
        let isHost = false;
        let peer, conn, mediaCall;
        let scale = 1.0, panX = 0, panY = 0, isEditMode = false;

        // --- NAVEGAÇÃO ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        if(myNick) document.getElementById('input-nick').value = myNick;

        function saveNickAndGo() {
            myNick = document.getElementById('input-nick').value.trim() || "Player";
            localStorage.setItem('fb_nick', myNick);
            document.getElementById('greet-msg').innerText = "Olá, " + myNick;
            showScreen('screen-menu');
        }
        function toRoleSelection() { showScreen('screen-role'); }
        function toJoinScreen() { showScreen('screen-join'); }
        function backToMenu() { location.reload(); }

        // --- HOST (STREAMER) LOGIC ---
        function setupHost(role) {
            isHost = true;
            myRole = role;
            showScreen('screen-host-lobby');

            // 1. Carrega o jogo escondido para preparar
            loadRuffleGame();

            // 2. Cria Peer
            const id = Math.random().toString(36).substring(2, 8).toUpperCase();
            peer = new Peer(id);

            peer.on('open', (peerId) => {
                document.getElementById('host-code').value = peerId;
            });

            peer.on('connection', (c) => {
                conn = c;
                document.getElementById('host-status').innerText = "Cliente Conectado!";
                setupDataConnection();
                
                // Inicia transmissão assim que conecta dados
                startStreamingToClient(conn.peer);
            });
        }

        async function startStreamingToClient(remotePeerId) {
            document.getElementById('loading-host').style.display = 'block';
            
            // Aguarda o Ruffle renderizar algo
            setTimeout(async () => {
                const player = document.getElementById('ruffle-instance');
                // Tenta pegar o canvas de dentro do ShadowDOM do Ruffle
                const canvas = player.shadowRoot ? player.shadowRoot.querySelector('canvas') : player.querySelector('canvas');
                
                if(!canvas) {
                    alert("Erro: Não foi possível capturar o jogo. Tente recarregar.");
                    return;
                }

                // Captura stream a 30fps
                const stream = canvas.captureStream(30);
                
                // Liga para o cliente com o vídeo
                const call = peer.call(remotePeerId, stream);
                
                // Muda para tela do jogo
                enterGameView();
                
                // Envia info inicial
                conn.send({ type: 'init', hostRole: myRole });

            }, 3000); // 3 segundos para garantir que o Ruffle carregou
        }

        function loadRuffleGame() {
            const player = document.getElementById('ruffle-instance');
            player.style.display = 'block'; // Host vê o Ruffle
            
            window.RufflePlayer = window.RufflePlayer || {};
            const ruffle = window.RufflePlayer.newest();
            
            // Configurações do Ruffle
            player.config = { letterbox: "on", autoplay: "on", unmuteOverlay: "hidden", backgroundColor: "#000000" };
            player.load("jogo.swf");
            
            // Loop de Foco
            setInterval(() => { if(!player.hasFocus) player.focus(); }, 1000);
        }

        // --- CLIENT (VIEWER) LOGIC ---
        function joinRoom() {
            isHost = false;
            const code = document.getElementById('join-code').value.toUpperCase();
            if(code.length < 4) return;

            document.getElementById('join-status').innerText = "Conectando...";
            peer = new Peer();

            peer.on('open', () => {
                conn = peer.connect(code);
                conn.on('open', () => {
                    document.getElementById('join-status').innerText = "Conectado! Aguardando Vídeo...";
                    setupDataConnection();
                });
            });

            peer.on('call', (call) => {
                // Recebeu a ligação de vídeo do Host
                document.getElementById('join-status').innerText = "Vídeo Recebido! Abrindo...";
                call.answer(); // Atende
                call.on('stream', (remoteStream) => {
                    const video = document.getElementById('remote-video');
                    video.style.display = 'block'; // Cliente vê o Vídeo
                    video.srcObject = remoteStream;
                    enterGameView();
                });
            });

            peer.on('error', () => { document.getElementById('join-status').innerText = "Sala não encontrada."; });
        }

        // --- COMMON LOGIC ---
        function setupDataConnection() {
            conn.on('data', (data) => {
                // Se sou Cliente, recebo qual é meu papel
                if(!isHost && data.type === 'init') {
                    myRole = (data.hostRole === 'fireboy') ? 'watergirl' : 'fireboy';
                    showToast("Você é: " + (myRole === 'fireboy' ? "🔥 Fireboy" : "💧 Watergirl"));
                }
                
                // Se sou Host, recebo Inputs do Cliente e aplico no Ruffle
                if(isHost && data.type === 'input') {
                    execKeyHost(data.role, data.action, data.keyType);
                }
            });
        }

        function enterGameView() {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'block';
            try { document.documentElement.requestFullscreen(); } catch(e){}
        }

        function showToast(msg) {
            const div = document.createElement('div');
            div.innerText = msg;
            div.style.cssText = "position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.7); color:white; padding:10px; border-radius:10px; z-index:999;";
            document.body.appendChild(div);
            setTimeout(()=>div.remove(), 3000);
        }

        // --- INPUT HANDLING ---
        const keyDefinitions = {
            'ArrowUp':    { keyCode: 38, key: 'ArrowUp',    code: 'ArrowUp' },
            'ArrowDown':  { keyCode: 40, key: 'ArrowDown',  code: 'ArrowDown' },
            'ArrowLeft':  { keyCode: 37, key: 'ArrowLeft',  code: 'ArrowLeft' },
            'ArrowRight': { keyCode: 39, key: 'ArrowRight', code: 'ArrowRight' },
            'KeyW': { keyCode: 87, key: 'w', code: 'KeyW' },
            'KeyS': { keyCode: 83, key: 's', code: 'KeyS' },
            'KeyA': { keyCode: 65, key: 'a', code: 'KeyA' },
            'KeyD': { keyCode: 68, key: 'd', code: 'KeyD' }
        };

        const roleMap = {
            fireboy:   { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
            watergirl: { up: 'KeyW',    down: 'KeyS',      left: 'KeyA',      right: 'KeyD' }
        };

        // Função que realmente aperta a tecla (Só roda no Host)
        function execKeyHost(role, action, type) {
            const defId = roleMap[role][action];
            const def = keyDefinitions[defId];
            if (!def) return;

            const eventOptions = {
                key: def.key, code: def.code, keyCode: def.keyCode,
                which: def.keyCode, bubbles: true, cancelable: true, view: window
            };
            const player = document.querySelector('ruffle-player');
            if(player) player.dispatchEvent(new KeyboardEvent(type, eventOptions));
        }

        // Função dos botões touch
        function setupBtn(id, action) {
            const btn = document.getElementById(id);
            const handle = (e, type) => {
                e.preventDefault();
                
                // Se sou Host, executo localmente
                if(isHost) {
                    if(myRole) execKeyHost(myRole, action, type);
                } 
                // Se sou Cliente, envio para o Host
                else {
                    if(conn && conn.open && myRole) {
                        conn.send({ type: 'input', role: myRole, action: action, keyType: type });
                    }
                }
                
                btn.style.background = type === 'keydown' ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
            };
            btn.addEventListener('touchstart', (e) => handle(e, 'keydown'));
            btn.addEventListener('touchend', (e) => handle(e, 'keyup'));
        }

        setupBtn('btn-up', 'up'); setupBtn('btn-down', 'down');
        setupBtn('btn-left', 'left'); setupBtn('btn-right', 'right');
        setupBtn('btn-jump', 'up');

        // --- ZOOM & PAN (Funciona tanto no Ruffle quanto no Video) ---
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const panel = document.getElementById('settings-panel');
            const overlay = document.getElementById('edit-overlay');
            const ui = document.getElementById('ui-layer');

            if(isEditMode) {
                panel.style.display = 'flex'; overlay.style.display = 'flex';
                ui.style.display = 'none';
            } else {
                panel.style.display = 'none'; overlay.style.display = 'none';
                ui.style.display = 'block';
            }
        }

        function updateTransform() {
            // Aplica no Wrapper, afetando ou Ruffle ou Video
            document.getElementById('game-wrapper').style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }
        function updateZoom(val) {
            scale = parseFloat(val);
            document.getElementById('zoom-val').innerText = scale.toFixed(1);
            updateTransform();
        }

        const overlay = document.getElementById('edit-overlay');
        let isDragging = false, startX, startY, initX, initY;
        overlay.addEventListener('touchstart', (e) => {
            if(!isEditMode) return;
            isDragging = true;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            initX = panX; initY = panY;
        });
        overlay.addEventListener('touchmove', (e) => {
            if(!isDragging || !isEditMode) return;
            e.preventDefault();
            panX = initX + (e.touches[0].clientX - startX);
            panY = initY + (e.touches[0].clientY - startY);
            updateTransform();
        });
        overlay.addEventListener('touchend', () => isDragging = false);

    </script>
</body>
</html>
