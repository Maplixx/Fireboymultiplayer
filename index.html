<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fireboy V9 - Debug Mode</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; background: #000; overflow: hidden;
            font-family: monospace; width: 100vw; height: 100dvh;
            color: white; display: flex; justify-content: center; align-items: center;
        }

        /* PAINEL */
        .glass-panel {
            background: #111; border: 1px solid #333; border-radius: 10px;
            padding: 20px; width: 95%; max-width: 400px; text-align: center;
            display: flex; flex-direction: column; gap: 10px;
        }

        /* CONSOLE DE ERROS */
        #debug-log {
            width: 100%; height: 80px; background: #000; border: 1px solid #555;
            color: #0f0; font-size: 10px; text-align: left; padding: 5px;
            overflow-y: scroll; margin-top: 10px; white-space: pre-wrap;
        }
        .error-msg { color: #ff3333; }
        .warn-msg { color: #ffff33; }

        input { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; text-align: center; }
        button { width: 100%; padding: 15px; cursor: pointer; font-weight: bold; border: none; border-radius: 5px; }
        .btn-host { background: #007bff; color: white; }
        .btn-join { background: #28a745; color: white; }
        .btn-start { background: #ffc107; color: black; margin-top: 10px; }

        .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; justify-content: center; align-items: center; z-index: 50; }
        .active { display: flex; }

        /* JOGO */
        #game-view { display: none; width: 100%; height: 100%; position: relative; background: #000; }
        #game-wrapper { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        ruffle-player { width: 800px; height: 600px; display: none; }
        video { width: 100%; height: 100%; display: none; object-fit: contain; }

        /* CONTROLES */
        #ui-layer { position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }
        .d-pad { position: absolute; bottom: 20px; left: 20px; width: 180px; height: 180px; pointer-events: auto; }
        .d-btn {
            position: absolute; width: 60px; height: 60px; border-radius: 10px;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center; font-size: 24px;
        }
        .d-btn:active { background: rgba(255,255,255,0.5); }
        .d-up { top:0; left:60px; } .d-down { bottom:0; left:60px; }
        .d-left { top:60px; left:0; } .d-right { top:60px; right:0; }
        .action-btn {
            position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
            background: rgba(255,0,0,0.3); border: 2px solid rgba(255,100,100,0.5); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 30px; pointer-events: auto;
        }
        .action-btn:active { background: rgba(255,0,0,0.6); }

        #settings-btn { position: absolute; top:5px; right:5px; padding:5px; z-index:200; pointer-events:auto; font-size:12px; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <div class="glass-panel">
            <h3>Fireboy V9 (Debug)</h3>
            <div style="font-size: 12px; color: #aaa; text-align: left;">
                Regras:<br>
                1. Host DEVE ser Android/PC (Não iPhone).<br>
                2. Use HTTPS (Cadeado no navegador).
            </div>
            <input type="text" id="input-nick" placeholder="Seu Nick">
            <button class="btn-host" onclick="initHost()">HOST (CRIAR)</button>
            <button class="btn-join" onclick="showJoin()">CLIENT (ENTRAR)</button>
            
            <div id="debug-log">Log do Sistema Iniciado...</div>
        </div>
    </div>

    <div id="screen-host" class="screen">
        <div class="glass-panel">
            <h3>Sala Criada</h3>
            <input type="text" id="host-code" readonly value="Carregando..." style="color:cyan; font-weight:bold;">
            <p id="host-status">Esperando PeerJS...</p>
            
            <div id="step-2" style="display:none; border-top:1px solid #333; padding-top:10px;">
                <p style="color:#0f0">Amigo Conectado!</p>
                <button class="btn-start" onclick="requestScreenShare()">COMPARTILHAR TELA</button>
            </div>
            
            <button onclick="location.reload()" style="background:#333; margin-top:10px;">Cancelar</button>
        </div>
    </div>

    <div id="screen-join" class="screen">
        <div class="glass-panel">
            <h3>Entrar</h3>
            <input type="text" id="join-input" placeholder="Código da Sala">
            <button class="btn-join" onclick="joinRoom()">CONECTAR</button>
            <p id="join-status"></p>
            <button onclick="location.reload()" style="background:#333; margin-top:10px;">Voltar</button>
        </div>
    </div>

    <div id="game-view">
        <div id="game-wrapper">
            <ruffle-player id="ruffle-inst"></ruffle-player>
            <video id="remote-vid" autoplay playsinline></video>
        </div>
        <button id="settings-btn" onclick="toggleLog()">Log</button>

        <div id="ui-layer">
            <div class="d-pad">
                <div class="d-btn d-up" id="btn-up">⬆</div>
                <div class="d-btn d-left" id="btn-left">⬅</div>
                <div class="d-btn d-right" id="btn-right">➡</div>
                <div class="d-btn d-down" id="btn-down">⬇</div>
            </div>
            <div class="action-btn" id="btn-jump">↟</div>
        </div>
    </div>

    <script>
        // --- SISTEMA DE LOG ---
        function log(msg, type='') {
            const div = document.getElementById('debug-log');
            const line = document.createElement('div');
            line.innerText = `> ${msg}`;
            if(type === 'error') line.className = 'error-msg';
            if(type === 'warn') line.className = 'warn-msg';
            div.appendChild(line);
            div.scrollTop = div.scrollHeight;
            console.log(msg);
        }

        // --- VERIFICAÇÃO INICIAL ---
        window.onload = () => {
            if(location.protocol !== 'https:' && location.hostname !== 'localhost') {
                log("ERRO CRÍTICO: SITE NÃO É HTTPS!", 'error');
                log("O compartilhamento de tela NÃO vai funcionar.", 'error');
                alert("ERRO: Você precisa usar HTTPS ou o compartilhamento será bloqueado pelo navegador.");
            } else {
                log("Conexão Segura (HTTPS) detectada.");
            }
            
            // Verifica suporte a Screen Share
            if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
                log("AVISO: Seu navegador parece não suportar compartilhamento de tela (iPhone?).", 'warn');
            }
        };

        let peer, conn, isHost = false, myRole = 'fireboy';

        function show(id) { 
            document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); 
            document.getElementById(id).classList.add('active'); 
        }

        // --- HOST LOGIC ---
        function initHost() {
            log("Iniciando Host...");
            isHost = true;
            show('screen-host');

            // Carrega Ruffle
            try {
                window.RufflePlayer = window.RufflePlayer || {};
                const ruffle = window.RufflePlayer.newest();
                const player = document.getElementById('ruffle-inst');
                player.config = { letterbox: "on", autoplay: "on", unmuteOverlay: "hidden", backgroundColor: "#000000" };
                player.load("jogo.swf");
                log("Ruffle carregado.");
            } catch(e) {
                log("Erro ao carregar Ruffle: " + e.message, 'error');
            }

            // Cria Peer
            try {
                const id = Math.random().toString(36).substring(2,6).toUpperCase();
                peer = new Peer(id, { debug: 2 });
                
                peer.on('open', (peerId) => {
                    document.getElementById('host-code').value = peerId;
                    document.getElementById('host-status').innerText = "Aguardando jogador...";
                    log("Servidor PeerJS conectado. ID: " + peerId);
                });

                peer.on('error', (err) => {
                    log("Erro PeerJS: " + err.type, 'error');
                    alert("Erro de conexão. Tente recarregar a página.");
                });

                peer.on('connection', (c) => {
                    conn = c;
                    log("Jogador conectado!");
                    document.getElementById('host-status').style.display = 'none';
                    document.getElementById('step-2').style.display = 'block';
                    setupData();
                });
            } catch(e) {
                log("Falha ao criar Peer: " + e.message, 'error');
            }
        }

        async function requestScreenShare() {
            log("Solicitando permissão de tela...");
            try {
                // Tenta capturar
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30, cursor: "always" },
                    audio: { 
                        echoCancellation: false, 
                        noiseSuppression: false, 
                        autoGainControl: false 
                    }
                });
                
                log("Permissão concedida!");
                
                // Verifica se tem áudio
                if(stream.getAudioTracks().length === 0) {
                    log("AVISO: Usuário não compartilhou áudio.", 'warn');
                    alert("Atenção: Você não marcou 'Compartilhar Áudio'. O jogo ficará mudo.");
                }

                // Liga para o cliente
                const call = peer.call(conn.peer, stream);
                log("Transmitindo stream...");

                // UI
                document.getElementById('ruffle-inst').style.display = 'block';
                enterGame();
                conn.send({ type: 'start' });

                // Monitora fim
                stream.getVideoTracks()[0].onended = () => {
                    log("Compartilhamento encerrado pelo usuário.");
                    location.reload();
                };

            } catch(err) {
                log("ERRO AO CAPTURAR: " + err.name + " - " + err.message, 'error');
                if(err.name === 'NotAllowedError') {
                    alert("Você negou a permissão ou cancelou. Tente de novo.");
                } else if (err.name === 'NotFoundError') {
                    alert("Seu dispositivo não suporta isso. Tente num PC ou Android atualizado.");
                } else {
                    alert("Erro: " + err.message);
                }
            }
        }

        // --- CLIENT LOGIC ---
        function showJoin() { show('screen-join'); }

        function joinRoom() {
            isHost = false;
            const code = document.getElementById('join-input').value.toUpperCase();
            if(!code) return log("Digite um código!", 'warn');
            
            log("Tentando conectar a: " + code);
            document.getElementById('join-status').innerText = "Conectando...";

            try {
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect(code);
                    
                    conn.on('open', () => {
                        log("Conectado ao Host! Aguardando vídeo...");
                        document.getElementById('join-status').innerText = "Conectado! Aguarde o Host...";
                        setupData();
                    });

                    conn.on('error', (err) => log("Erro na conexão: " + err, 'error'));
                });

                peer.on('error', (err) => {
                    log("Erro PeerJS Cliente: " + err.type, 'error');
                    document.getElementById('join-status').innerText = "Erro: Código inválido ou erro de rede.";
                });

                peer.on('call', (call) => {
                    log("Recebendo chamada de vídeo...");
                    call.answer();
                    call.on('stream', (remoteStream) => {
                        log("Stream recebido!");
                        const vid = document.getElementById('remote-vid');
                        vid.style.display = 'block';
                        vid.srcObject = remoteStream;
                        enterGame();
                        // Hack para iOS Audio
                        vid.play().catch(e => log("Autoplay bloqueado (toque na tela)", 'warn'));
                    });
                });

            } catch(e) {
                log("Erro fatal cliente: " + e.message, 'error');
            }
        }

        function setupData() {
            conn.on('data', d => {
                if(isHost && d.type === 'input') execKey(d.role, d.action, d.kType);
            });
        }

        function enterGame() {
            document.querySelectorAll('.screen').forEach(s=>s.style.display='none');
            document.getElementById('game-view').style.display = 'flex';
            try{ document.documentElement.requestFullscreen(); }catch(e){}
        }

        function toggleLog() {
            const logDiv = document.getElementById('debug-log');
            const menu = document.querySelector('.glass-panel');
            if(document.getElementById('screen-menu').classList.contains('active')) {
                // Se estiver no menu, não faz nada
            } else {
                alert("Veja o log no menu inicial se houver erro.");
            }
        }

        // --- INPUTS ---
        const keys = { 'ArrowUp':38, 'ArrowDown':40, 'ArrowLeft':37, 'ArrowRight':39, 'KeyW':87, 'KeyS':83, 'KeyA':65, 'KeyD':68 };
        const map = { fireboy: {up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'}, watergirl: {up:'KeyW', down:'KeyS', left:'KeyA', right:'KeyD'} };

        function execKey(role, action, type) {
            const kCode = map[role][action];
            const evt = new KeyboardEvent(type, { code: kCode, key: (role==='watergirl'?kCode.replace('Key','').toLowerCase():kCode), keyCode: keys[kCode], which: keys[kCode], bubbles:true });
            document.querySelector('ruffle-player').dispatchEvent(evt);
        }

        function btnHandler(id, act) {
            const el = document.getElementById(id);
            const fn = (e, t) => {
                e.preventDefault();
                const targetRole = isHost ? 'fireboy' : 'watergirl';
                if(isHost) execKey(targetRole, act, t);
                else if(conn && conn.open) conn.send({type:'input', role:targetRole, action:act, kType:t});
                el.style.background = (t==='keydown')?"rgba(255,255,255,0.4)":"rgba(255,255,255,0.2)";
            };
            el.addEventListener('touchstart', e=>fn(e,'keydown'));
            el.addEventListener('touchend', e=>fn(e,'keyup'));
        }
        ['up','down','left','right'].forEach(d => btnHandler('btn-'+d, d));
        btnHandler('btn-jump', 'up');

    </script>
</body>
</html>
