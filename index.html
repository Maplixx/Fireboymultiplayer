<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fireboy & Watergirl iOS V5</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; 
            background: linear-gradient(135deg, #1c1c1e 0%, #2c3e50 100%);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 100vw; height: 100dvh;
            color: white;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- GLASSMORPHISM DESIGN --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 24px;
            padding: 30px;
            width: 90%; max-width: 380px;
            text-align: center;
            display: flex; flex-direction: column; gap: 15px;
            transition: all 0.3s ease;
        }

        h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.5px; }
        h2 { font-size: 24px; margin-bottom: 10px; }
        p { margin: 0; color: rgba(255,255,255,0.6); font-size: 14px; }

        input {
            width: 100%; padding: 15px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
            color: white; font-size: 18px; text-align: center; outline: none;
        }
        input:focus { border-color: #0a84ff; background: rgba(0,0,0,0.4); }

        button {
            width: 100%; padding: 16px; border-radius: 14px;
            border: none; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.96); }

        .btn-primary { background: #0a84ff; color: white; }
        .btn-sec { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
        .btn-fire { background: linear-gradient(90deg, #ff3b30, #ff9500); color: white; }
        .btn-water { background: linear-gradient(90deg, #5ac8fa, #007aff); color: white; }

        /* --- SCREENS --- */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; justify-content: center; align-items: center; z-index: 50; }
        .active { display: flex; }

        .player-tag {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 14px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #32d74b; box-shadow: 0 0 10px #32d74b; }
        
        /* --- LOADING BAR --- */
        .loader-container { width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 20px; display: none; }
        .loader-bar { height: 100%; width: 0%; background: #32d74b; transition: width 0.1s linear; }

        /* --- GAME VIEWPORT --- */
        #game-view {
            width: 100%; height: 100%; display: none; position: relative;
            background: #000; justify-content: center; align-items: center;
        }
        #game-wrapper { transform-origin: center; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        ruffle-player { width: 800px; height: 600px; }

        /* --- CONTROLS --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: none; }
        .d-pad { position: absolute; bottom: 20px; left: 20px; width: 180px; height: 180px; pointer-events: auto; }
        .d-btn {
            position: absolute; width: 60px; height: 60px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; color: white; border-radius: 12px;
        }
        .d-btn:active { background: rgba(255, 255, 255, 0.4); }
        .d-up { top: 0; left: 60px; } .d-down { bottom: 0; left: 60px; }
        .d-left { top: 60px; left: 0; } .d-right { top: 60px; right: 0; }
        
        .action-btn {
            position: absolute; bottom: 40px; right: 40px; width: 90px; height: 90px;
            background: rgba(255, 59, 48, 0.2); border: 1px solid rgba(255, 59, 48, 0.5);
            border-radius: 50%; pointer-events: auto; backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; font-size: 40px; color: white;
        }
        .action-btn:active { background: rgba(255, 59, 48, 0.6); }

        #settings-btn {
            position: absolute; top: 10px; right: 10px; z-index: 200;
            background: rgba(0,0,0,0.5); color: white; border: none;
            padding: 8px 12px; border-radius: 20px; pointer-events: auto; backdrop-filter: blur(10px);
        }
        #settings-panel {
            position: absolute; top: 50px; right: 10px;
            background: rgba(20, 20, 20, 0.9); padding: 20px; border-radius: 20px;
            color: white; display: none; flex-direction: column; gap: 15px;
            pointer-events: auto; z-index: 200; width: 240px; border: 1px solid #333;
        }
        .edit-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border: 4px dashed #ffd60a; z-index: 50; display: none; pointer-events: auto; 
            justify-content: center; align-items: center; color: #ffd60a; font-weight: bold; background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <div class="glass-panel">
            <h2>Bem-vindo</h2>
            <p>Escolha seu Nickname para jogar</p>
            <input type="text" id="input-nick" placeholder="Seu apelido..." maxlength="10">
            <button class="btn-primary" onclick="saveNickAndGo()">CONTINUAR</button>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <div class="glass-panel">
            <h2 id="greet-msg">Olá</h2>
            <button class="btn-primary" onclick="toRoleSelection()">CRIAR SALA</button>
            <button class="btn-sec" onclick="toJoinScreen()">ENTRAR EM SALA</button>
        </div>
    </div>

    <div id="screen-role" class="screen">
        <div class="glass-panel">
            <h2>Escolha seu lado</h2>
            <button class="btn-fire" onclick="setupHost('fireboy')">🔥 JOGAR COMO FIREBOY</button>
            <button class="btn-water" onclick="setupHost('watergirl')">💧 JOGAR COMO WATERGIRL</button>
            <button class="btn-sec" onclick="backToMenu()">Voltar</button>
        </div>
    </div>

    <div id="screen-host-lobby" class="screen">
        <div class="glass-panel">
            <h3>Sala Criada</h3>
            <p>Mande este código para seu amigo:</p>
            <input type="text" id="host-code" readonly style="font-size: 24px; letter-spacing: 3px; font-weight: bold; color: #32d74b;">
            
            <div style="text-align: left; margin-top: 10px;">
                <p style="margin-bottom: 5px;">Jogadores na sala:</p>
                <div class="player-tag">
                    <span id="p1-name">Eu (Host)</span> <div class="status-dot"></div>
                </div>
                <div class="player-tag" style="margin-top: 5px; opacity: 0.5;" id="p2-container">
                    <span id="p2-name">Aguardando...</span> <div id="p2-dot" class="status-dot" style="background: #555; box-shadow: none;"></div>
                </div>
            </div>

            <button id="btn-start-game" class="btn-primary" onclick="triggerStartGame()" disabled style="opacity: 0.5;">INICIAR JOGO</button>
            
            <div class="loader-container" id="loader-host">
                <div class="loader-bar" id="bar-host"></div>
            </div>
            
            <button class="btn-sec" onclick="location.reload()">Cancelar</button>
        </div>
    </div>

    <div id="screen-join" class="screen">
        <div class="glass-panel">
            <h3>Entrar na Sala</h3>
            <input type="text" id="join-code" placeholder="CÓDIGO" maxlength="6" style="text-transform: uppercase;">
            <button class="btn-primary" onclick="joinRoom()">CONECTAR</button>
            <p id="join-status">Aguardando conexão...</p>
            
            <div class="loader-container" id="loader-client">
                <div class="loader-bar" id="bar-client"></div>
            </div>

            <button class="btn-sec" onclick="backToMenu()">Voltar</button>
        </div>
    </div>

    <div id="game-view">
        <div id="edit-overlay" class="edit-overlay">ARRASTE PARA MOVER A TELA</div>
        <div id="game-wrapper"></div>
        
        <button id="settings-btn" onclick="toggleEditMode()">⚙️ Ajustes</button>
        <div id="settings-panel">
            <label>Zoom da Tela: <span id="zoom-val">1.0</span>x</label>
            <input type="range" id="zoom-slider" min="0.5" max="2.0" step="0.1" value="1.0" oninput="updateZoom(this.value)">
            <button class="btn-sec" onclick="toggleEditMode()">OK</button>
        </div>

        <div id="ui-layer">
            <div class="d-pad">
                <div class="d-btn d-up" id="btn-up">⬆</div>
                <div class="d-btn d-left" id="btn-left">⬅</div>
                <div class="d-btn d-right" id="btn-right">➡</div>
                <div class="d-btn d-down" id="btn-down">⬇</div>
            </div>
            <div class="action-btn" id="btn-jump">↟</div>
        </div>
    </div>

    <script>
        // --- ESTADO GLOBAL ---
        let myNick = "";
        let myRole = "";
        let peer, conn;
        let scale = 1.0, panX = 0, panY = 0, isEditMode = false;

        // --- NAVEGAÇÃO ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // 1. LOGIN LOGIC
        window.onload = () => {
            const stored = localStorage.getItem('fireboy_nick');
            if(stored) document.getElementById('input-nick').value = stored;
        };

        function saveNickAndGo() {
            const val = document.getElementById('input-nick').value.trim();
            if(!val) return alert("Por favor, digite um nick.");
            myNick = val;
            localStorage.setItem('fireboy_nick', myNick);
            document.getElementById('greet-msg').innerText = "Olá, " + myNick;
            showScreen('screen-menu');
        }

        function toRoleSelection() { showScreen('screen-role'); }
        function toJoinScreen() { showScreen('screen-join'); }
        function backToMenu() { showScreen('screen-menu'); }

        // --- PEERJS LOGIC (HOST) ---
        function setupHost(role) {
            myRole = role;
            showScreen('screen-host-lobby');
            document.getElementById('p1-name').innerText = myNick + " (Você)";
            
            // Gera ID curto
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            peer = new Peer(code);

            peer.on('open', (id) => {
                document.getElementById('host-code').value = id;
            });

            peer.on('error', () => { alert("Erro ao criar sala. Tente novamente."); location.reload(); });

            peer.on('connection', (c) => {
                conn = c;
                setupConnection();
            });
        }

        // --- PEERJS LOGIC (CLIENT) ---
        function joinRoom() {
            const code = document.getElementById('join-code').value.toUpperCase();
            if(code.length < 4) return;
            
            document.getElementById('join-status').innerText = "Buscando sala...";
            peer = new Peer();
            
            peer.on('open', () => {
                conn = peer.connect(code);
                conn.on('open', () => {
                    document.getElementById('join-status').innerText = "Conectado! Aguardando Host iniciar...";
                    // Envia meu nick assim que conecta
                    conn.send({ type: 'handshake', nick: myNick });
                });
                setupConnection();
            });
            
            peer.on('error', () => { document.getElementById('join-status').innerText = "Sala não encontrada."; });
        }

        // --- COMUNICAÇÃO ---
        function setupConnection() {
            conn.on('data', (data) => {
                // Handshake: Troca de Nomes
                if(data.type === 'handshake') {
                    if(document.getElementById('screen-host-lobby').classList.contains('active')) {
                        // Sou HOST, recebi nick do cliente
                        document.getElementById('p2-name').innerText = data.nick;
                        document.getElementById('p2-container').style.opacity = "1";
                        document.getElementById('p2-dot').style.background = "#32d74b";
                        document.getElementById('p2-dot').style.boxShadow = "0 0 10px #32d74b";
                        
                        // Libera botão Start
                        const btn = document.getElementById('btn-start-game');
                        btn.disabled = false;
                        btn.style.opacity = "1";
                        
                        // Mando meu nick e a role de volta
                        conn.send({ type: 'handshake_back', nick: myNick, hostRole: myRole });
                    }
                }
                
                // Handshake Volta: Cliente recebe dados do Host
                if(data.type === 'handshake_back') {
                    document.getElementById('join-status').innerText = `Conectado a ${data.nick}! Aguarde...`;
                    myRole = (data.hostRole === 'fireboy') ? 'watergirl' : 'fireboy';
                }

                // Iniciar Jogo
                if(data.type === 'start_game') {
                    runLoadingSequence('client');
                }

                // Input do Jogo
                if(data.type === 'input') {
                    execKey(data.role, data.action, data.keyType);
                }
            });
        }

        // --- GAME START LOGIC ---
        function triggerStartGame() {
            // Avisa o cliente
            conn.send({ type: 'start_game' });
            runLoadingSequence('host');
        }

        function runLoadingSequence(mode) {
            const bar = document.getElementById(mode === 'host' ? 'bar-host' : 'bar-client');
            const container = document.getElementById(mode === 'host' ? 'loader-host' : 'loader-client');
            
            container.style.display = 'block';
            if(mode === 'host') document.getElementById('btn-start-game').style.display = 'none';

            // Animação fake de loading
            let width = 0;
            const interval = setInterval(() => {
                width += 5;
                bar.style.width = width + '%';
                if(width >= 100) {
                    clearInterval(interval);
                    injectGame(); // CARREGA O SWF AGORA
                }
            }, 50); // ~1 segundo de loading
        }

        function injectGame() {
            // Esconde UI e mostra jogo
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById('game-view').style.display = 'flex';
            document.getElementById('ui-layer').style.display = 'block';

            // Carrega Ruffle
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const wrapper = document.getElementById("game-wrapper");
            wrapper.appendChild(player);
            
            player.config = { letterbox: "on", autoplay: "on", unmuteOverlay: "hidden", backgroundColor: "#000000" };
            player.load("jogo.swf");

            // Loop de Foco
            setInterval(() => { if(!player.hasFocus) player.focus(); }, 1000);
            
            // Fullscreen
            try { document.documentElement.requestFullscreen(); } catch(e){}
        }

        // --- CONTROLES DE JOGO ---
        const keyDefinitions = {
            'ArrowUp':    { keyCode: 38, key: 'ArrowUp',    code: 'ArrowUp' },
            'ArrowDown':  { keyCode: 40, key: 'ArrowDown',  code: 'ArrowDown' },
            'ArrowLeft':  { keyCode: 37, key: 'ArrowLeft',  code: 'ArrowLeft' },
            'ArrowRight': { keyCode: 39, key: 'ArrowRight', code: 'ArrowRight' },
            'KeyW': { keyCode: 87, key: 'w', code: 'KeyW' },
            'KeyS': { keyCode: 83, key: 's', code: 'KeyS' },
            'KeyA': { keyCode: 65, key: 'a', code: 'KeyA' },
            'KeyD': { keyCode: 68, key: 'd', code: 'KeyD' }
        };

        const roleMap = {
            fireboy:   { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
            watergirl: { up: 'KeyW',    down: 'KeyS',      left: 'KeyA',      right: 'KeyD' }
        };

        function execKey(role, action, type) {
            const defId = roleMap[role][action];
            const def = keyDefinitions[defId];
            if (!def) return;

            const eventOptions = {
                key: def.key, code: def.code, keyCode: def.keyCode,
                which: def.keyCode, bubbles: true, cancelable: true, view: window
            };
            const player = document.querySelector('ruffle-player');
            if(player) player.dispatchEvent(new KeyboardEvent(type, eventOptions));
        }

        function setupBtn(id, action) {
            const btn = document.getElementById(id);
            const handle = (e, type) => {
                e.preventDefault();
                if(myRole) {
                    execKey(myRole, action, type);
                    if(conn && conn.open) conn.send({ type: 'input', role: myRole, action: action, keyType: type });
                }
                btn.style.background = type === 'keydown' ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,0.1)";
            };
            btn.addEventListener('touchstart', (e) => handle(e, 'keydown'));
            btn.addEventListener('touchend', (e) => handle(e, 'keyup'));
        }

        setupBtn('btn-up', 'up'); setupBtn('btn-down', 'down');
        setupBtn('btn-left', 'left'); setupBtn('btn-right', 'right');
        setupBtn('btn-jump', 'up');

        // --- AJUSTES DE TELA ---
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const panel = document.getElementById('settings-panel');
            const overlay = document.getElementById('edit-overlay');
            const ui = document.getElementById('ui-layer');

            if(isEditMode) {
                panel.style.display = 'flex'; overlay.style.display = 'flex';
                ui.style.display = 'none';
            } else {
                panel.style.display = 'none'; overlay.style.display = 'none';
                ui.style.display = 'block';
            }
        }

        function updateTransform() {
            document.getElementById('game-wrapper').style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }
        function updateZoom(val) {
            scale = parseFloat(val);
            document.getElementById('zoom-val').innerText = scale.toFixed(1);
            updateTransform();
        }

        const overlay = document.getElementById('edit-overlay');
        let isDragging = false, startX, startY, initX, initY;
        overlay.addEventListener('touchstart', (e) => {
            if(!isEditMode) return;
            isDragging = true;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
            initX = panX; initY = panY;
        });
        overlay.addEventListener('touchmove', (e) => {
            if(!isDragging || !isEditMode) return;
            e.preventDefault();
            panX = initX + (e.touches[0].clientX - startX);
            panY = initY + (e.touches[0].clientY - startY);
            updateTransform();
        });
        overlay.addEventListener('touchend', () => isDragging = false);

    </script>
</body>
</html>
